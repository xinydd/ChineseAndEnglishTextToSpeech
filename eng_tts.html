<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text to Speech</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    textarea {
      width: 300px;
      height: 100px;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Text to Speech Converter</h1>
  <textarea id="text" placeholder="Type something here..."></textarea><br>
  <button onclick="speakText()">Speak</button>

  <script>
    function speakText() {
      const text = document.getElementById("text").value;
      if (!text.trim()) {
        alert("Please enter some text.");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      // Optional: Set voice, pitch, rate, etc.
      utterance.lang = 'en-US';
      utterance.pitch = 1;
      utterance.rate = 1;

      speechSynthesis.speak(utterance);
    }
  </script>

</body>
</html>
