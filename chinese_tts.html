<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Chinese Text to Speech & Speech to Text</title>
  <style>
    body {
      font-family: "kaiti", sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f9f9f9;
    }

    h1 {
      color: #333;
    }

    textarea {
      font-family: "kaiti", sans-serif;
      width: 90%;
      max-width: 500px;
      height: 100px;
      font-size: 20px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .button-group {
      margin-top: 20px;
    }

    button {
      font-family: "kaiti", sans-serif;
      margin: 10px;
      padding: 10px 20px;
      font-size: 20px;
      background-color: #f4ad39;
      color: rgb(0, 0, 0);
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #f7cb5e;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>中文语音互动&#126980;</h1>
  <textarea id="text" placeholder="请说话或输入文字..."></textarea>
  
  <div class="button-group">
    <button onclick="startRecognition()">&#127908; 语音转文字</button>
    <button onclick="speakChinese()">&#128266; 文字转语音</button>
  </div>

  <div id="status"></div>

  <script>
    // Text-to-Speech (TTS)
    function speakChinese() {
      const text = document.getElementById("text").value.trim();
      if (!text) {
        alert("请输入或使用语音输入一些中文文字！");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';

      const voices = speechSynthesis.getVoices();
      const chineseVoice = voices.find(v => v.lang.startsWith('zh'));
      if (chineseVoice) {
        utterance.voice = chineseVoice;
      }

      speechSynthesis.speak(utterance);
    }

    // Preload voices
    window.speechSynthesis.onvoiceschanged = () => {
      speechSynthesis.getVoices();
    };

    // Speech-to-Text (STT)
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'zh-CN';
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onstart = () => {
      document.getElementById("status").innerText = " 正在聆听...";
    };

    recognition.onspeechend = () => {
      document.getElementById("status").innerText = " 停止聆听";
      recognition.stop();
    };

    recognition.onerror = (event) => {
      document.getElementById("status").innerText = " 错误：" + event.error;
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById("text").value = transcript;
      document.getElementById("status").innerText = " 识别成功";
    };

    function startRecognition() {
      recognition.start();
    }
  </script>

</body>
</html>
